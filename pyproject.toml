[project]
name = "browser-automation-mcp"
version = "7.0.0"
description = "MCP server that lets an LLM do anything in any browser where the companion extension is installed — forms, quizzes, coding challenges, workflows, purchases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "BroswerAutomate contributors" },
]
keywords = ["mcp", "browser-automation", "chrome-extension", "fastmcp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer — pin to 1.x until a migration
    "mcp>=1.0.0,<2",
    "pydantic>=2.5.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[project.urls]
"Homepage" = "https://github.com/sarthakroutray/BroswerAutomate"
"Source" = "https://github.com/sarthakroutray/BroswerAutomate"
"Issues" = "https://github.com/sarthakroutray/BroswerAutomate/issues"

[project.scripts]
browser-automation-mcp = "server.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.setuptools]
license-files = ["LICENSE*"]

# ── Pytest configuration ──────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "live: tests that require live external services (browser, network). Run with: pytest -m live",
    "slow: tests that take more than 5 seconds.",
]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::FutureWarning",
]

# ── Coverage configuration ───────────────────────────────────────────────────

[tool.coverage.run]
branch = true
source = ["server"]
omit = [
    "server/venv/*",
    "server/tools/__init__.py",
    "server/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
