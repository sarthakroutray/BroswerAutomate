<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Bridge</title>
  <style>
    /* ── Tokens ────────────────────────────────────────────────────────────
       Warm near-black neutrals (hue 60) so grays feel authored, not dead.
       One copper accent reserved for "live" activity. Status semantics carry
       the only other color: copper = working, green = connected, red = error. */
    :root {
      --canvas: oklch(0.155 0.008 60);
      --surface: oklch(0.195 0.010 60);
      --surface-2: oklch(0.238 0.012 60);
      --border: oklch(0.290 0.012 60);
      --border-strong: oklch(0.400 0.014 60);
      --text: oklch(0.960 0.004 60);
      --muted: oklch(0.740 0.010 60);
      --faint: oklch(0.660 0.010 60);
      --accent: oklch(0.770 0.120 52);
      --accent-strong: oklch(0.830 0.130 52);
      --on-accent: oklch(0.180 0.020 52);
      --success: oklch(0.760 0.150 155);
      --danger: oklch(0.680 0.190 25);
      --focus: oklch(0.800 0.130 52);
      --primary-bg: oklch(0.940 0.005 60);
      --primary-text: oklch(0.180 0.010 60);

      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", monospace;

      /* 1-4-9 rhythm: 4px micro, 16px block, 36px macro */
      --r-sm: 6px;
      --r: 9px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: var(--font);
      background: var(--canvas);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 12px;
    }

    .glyph {
      width: 22px;
      height: 22px;
      flex: none;
      color: var(--accent);
    }

    .wordmark {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .header .tag {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--faint);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 2px 6px;
    }

    /* ── Status board ─────────────────────────────────────────────────── */
    .board {
      margin: 0 16px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .state-dot {
      width: 10px;
      height: 10px;
      flex: none;
      border-radius: 50%;
      background: transparent;
      border: 2px solid var(--faint);
      transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease);
    }

    .board[data-state="connected"] .state-dot {
      background: var(--success);
      border-color: var(--success);
    }

    .board[data-state="connecting"] .state-dot {
      background: var(--accent);
      border-color: var(--accent);
      animation: pulse 1.6s var(--ease) infinite;
    }

    .board[data-state="error"] .state-dot {
      background: var(--danger);
      border-color: var(--danger);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent) 45%, transparent);
      }

      70% {
        box-shadow: 0 0 0 6px transparent;
      }

      100% {
        box-shadow: 0 0 0 0 transparent;
      }
    }

    .board-text {
      min-width: 0;
    }

    .state-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .state-meta {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Primary action ───────────────────────────────────────────────── */
    .actions {
      padding: 12px 16px 12px;
    }

    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--r);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 16px;
      transition: transform 0.15s var(--ease), background-color 0.15s var(--ease),
        border-color 0.15s var(--ease), color 0.15s var(--ease);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .btn:disabled {
      cursor: default;
    }

    .btn--primary {
      width: 100%;
      background: var(--primary-bg);
      color: var(--primary-text);
    }

    .btn--primary:hover:not(:disabled) {
      background: oklch(0.985 0.004 60);
    }

    .btn--primary:disabled {
      background: var(--surface);
      color: var(--faint);
      border-color: var(--border);
    }

    .btn--quiet {
      width: 100%;
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }

    .btn--quiet:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--border-strong);
      background: var(--surface);
    }

    .btn--danger-quiet:hover:not(:disabled) {
      color: var(--danger);
      border-color: color-mix(in oklch, var(--danger) 40%, var(--border));
    }

    /* ── Settings groups ──────────────────────────────────────────────── */
    .group {
      padding: 4px 16px 0;
    }

    .group-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 8px;
    }

    .field {
      display: flex;
      gap: 8px;
    }

    .input {
      flex: 1;
      min-width: 0;
      min-height: 40px;
      padding: 0 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }

    .input::placeholder {
      color: var(--faint);
    }

    .input:hover {
      border-color: var(--border-strong);
    }

    .input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .field-btn {
      flex: none;
      min-height: 40px;
      min-width: 40px;
      padding: 0 12px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: color 0.15s var(--ease), border-color 0.15s var(--ease),
        background-color 0.15s var(--ease), transform 0.15s var(--ease);
    }

    .field-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .field-btn:active {
      transform: scale(0.97);
    }

    .field-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .field-btn[data-done="true"] {
      color: var(--success);
      border-color: color-mix(in oklch, var(--success) 45%, var(--border));
    }

    .hint {
      font-size: 11px;
      color: var(--faint);
      margin-top: 6px;
      line-height: 1.45;
    }

    /* Inline save confirmation — appears only when there is something to say */
    .saved {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--success);
      opacity: 0;
      transform: translateY(-1px);
      transition: opacity 0.15s var(--ease), transform 0.15s var(--ease);
    }

    .saved[data-show="true"] {
      opacity: 1;
      transform: none;
    }

    /* ── Notice ───────────────────────────────────────────────────────── */
    .notice {
      display: none;
      margin: 4px 16px 16px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      border-radius: var(--r-sm);
      border: 1px solid color-mix(in oklch, var(--danger) 45%, var(--border));
      background: color-mix(in oklch, var(--danger) 12%, var(--surface));
      color: oklch(0.880 0.060 25);
    }

    .notice[data-show="true"] {
      display: block;
    }

    /* ── Footer ───────────────────────────────────────────────────────── */
    .footer {
      margin-top: 16px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--faint);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer svg {
      color: var(--accent);
      flex: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h11a3 3 0 0 1 3 3v7" />
      <path d="M7 4 4 7l3 3" />
      <circle cx="18" cy="17" r="3" />
    </svg>
    <span class="wordmark">Browser Bridge</span>
    <span class="tag">MCP</span>
  </header>

  <section class="board" id="board" data-state="connecting" role="status" aria-live="polite">
    <span class="state-dot" aria-hidden="true"></span>
    <div class="board-text">
      <div class="state-title" id="stateTitle">Checking connection</div>
      <div class="state-meta" id="stateMeta">ws://localhost:8000</div>
    </div>
  </section>

  <div class="actions">
    <button class="btn btn--primary" id="primaryBtn" disabled>Connect</button>
  </div>

  <p class="notice" id="notice" role="alert" data-show="false"></p>

  <div class="group">
    <div class="group-label">
      Endpoint
      <span class="saved" id="urlSaved" role="status" data-show="false"></span>
    </div>
    <div class="field">
      <label class="sr-only" for="endpoint">MCP bridge server endpoint</label>
      <input class="input" id="endpoint" type="text" spellcheck="false" autocomplete="off"
        placeholder="ws://localhost:8000">
      <button class="field-btn" id="copyBtn" type="button" aria-label="Copy endpoint">Copy</button>
    </div>
  </div>

  <div class="group" style="padding-top: 16px;">
    <div class="group-label">
      Auth token
      <span class="saved" id="tokenSaved" role="status" data-show="false"></span>
    </div>
    <div class="field">
      <label class="sr-only" for="token">Auth token</label>
      <input class="input" id="token" type="password" spellcheck="false" autocomplete="off"
        placeholder="Not set">
      <button class="field-btn" id="tokenToggle" type="button" aria-pressed="false"
        aria-label="Show auth token">Show</button>
    </div>
    <p class="hint">Only needed when the server sets BROWSER_WS_AUTH_TOKEN.</p>
  </div>

  <footer class="footer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12h14" />
      <path d="m12 5 7 7-7 7" />
    </svg>
    Drive this browser from your MCP client
  </footer>

  <script src="popup.js"></script>
</body>

</html>
